<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#070708"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>NORT OS</title>
<link rel="stylesheet" href="panel.css?v=97"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<div id="boot" class="boot">NORT OS</div>
<section id="loginView" class="view login-view" hidden>
  <div class="login-card">
    <p class="brand-kicker">Real Nort México</p>
    <h1>NORT OS</h1>
    <p class="login-sub">Inventario, disponibilidad y publicación en vivo</p>
    <label class="field"><span>Usuario</span><input id="loginUser" autocomplete="username" placeholder="admin"/></label>
    <label class="field"><span>Contraseña</span><input id="loginPass" type="password" autocomplete="current-password"/></label>
    <p id="loginErr" class="err" hidden></p>
    <button type="button" class="btn gold" id="loginBtn">Entrar</button>
    <p class="login-hint">Mismo acceso para tu equipo · contenido publicado en el sitio</p>
  </div>
</section>
<section id="appView" class="view app-view" hidden>
  <header class="topbar">
    <div class="topbar-left"><span class="logo">NORT OS</span><span id="roleBadge" class="badge"></span></div>
    <div class="topbar-right">
      <span id="userLabel" class="user-label"></span>
      <a class="btn ghost sm" href="../index.html" target="_blank" rel="noopener">Sitio</a>
      <button type="button" class="btn ghost sm" id="logoutBtn">Salir</button>
    </div>
  </header>
  <nav id="nav" class="nav"></nav>
  <main id="main" class="main"></main>
</section>
<script src="../realtime.js?v=v97"></script>
<script src="panel.js?v=97"></script>
</body>
</html>
