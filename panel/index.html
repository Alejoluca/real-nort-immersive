<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#000000"/>
<title>NORT OS — Control</title>
<link rel="stylesheet" href="panel.css"/>
</head>
<body>
<div id="boot" class="boot">Cargando NORT OS…</div>

<section id="loginView" class="view login-view" hidden>
  <div class="login-card">
    <p class="brand-kicker">Real Nort México</p>
    <h1>NORT OS</h1>
    <p class="login-sub">Torre de control de inventario y demanda</p>
    <label class="field"><span>Usuario</span><input id="loginUser" autocomplete="username" placeholder="admin o email"/></label>
    <label class="field"><span>Contraseña</span><input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"/></label>
    <p id="loginErr" class="err" hidden></p>
    <button type="button" class="btn gold" id="loginBtn">Entrar</button>
    <p class="login-hint">Admin y propietarios · solo lectura para owners</p>
    <label class="field" style="margin-top:8px"><span>API pública (opcional)</span>
      <input id="apiConfig" type="url" placeholder="https://nort-os-api.onrender.com"/>
    </label>
    <button type="button" class="btn ghost" id="saveApiBtn" style="margin-top:4px">Guardar API</button>
  </div>
</section>

<section id="appView" class="view app-view" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">NORT OS</span>
      <span id="roleBadge" class="badge"></span>
    </div>
    <div class="topbar-right">
      <span id="userLabel" class="user-label"></span>
      <a class="btn ghost sm" href="../index.html" target="_blank" rel="noopener">Ver sitio</a>
      <button type="button" class="btn ghost sm" id="logoutBtn">Salir</button>
    </div>
  </header>
  <nav id="nav" class="nav"></nav>
  <main id="main" class="main"></main>
</section>

<script src="panel.js?v=72"></script>
</body>
</html>
