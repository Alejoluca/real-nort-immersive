services:
  - type: web
    name: nort-os-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://alejoluca.github.io
      - key: NORT_ADMIN_USER
        value: admin
      - key: NORT_ADMIN_EMAIL
        value: alejolucatelli@gmail.com
      - key: NORT_ADMIN_PASS
        generateValue: true
